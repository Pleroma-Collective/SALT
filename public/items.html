<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item Catalog - DayZ Dashboard</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/tailwind.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    body { background: var(--dzc-bg, #0f172a); color: var(--dzc-text, #e2e8f0); font-family: var(--dzc-font-body, system-ui, sans-serif); }
    .topbar { background: var(--dzc-surface, #1e293b); border-bottom: 1px solid var(--dzc-border, #334155); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .search-input { background: var(--dzc-bg, #0f172a); border: 1px solid var(--dzc-border-strong, #475569); color: var(--dzc-text, #e2e8f0); border-radius: var(--dzc-radius-sm, 6px); padding: 6px 10px; font-size: 13px; width: 260px; }
    .map-select { background: var(--dzc-bg, #0f172a); border: 1px solid var(--dzc-border-strong, #475569); color: var(--dzc-text, #e2e8f0); border-radius: var(--dzc-radius-sm, 6px); padding: 6px 10px; font-size: 13px; }
    .framing { padding: 12px 24px 0; font-size: 13px; color: var(--dzc-text-muted, #94a3b8); }
    .framing code { color: var(--dzc-text, #e2e8f0); }
    .tabs { display: flex; gap: 4px; padding: 12px 24px 0; flex-wrap: wrap; }
    .tab { padding: 6px 14px; border-radius: var(--dzc-radius-sm, 6px); font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--dzc-border, #334155); background: transparent; color: var(--dzc-text-muted, #94a3b8); }
    .tab.active { background: var(--dzc-accent, #3b82f6); border-color: var(--dzc-accent, #3b82f6); color: #fff; }
    .view-toggle { padding: 12px 24px 0; display: flex; gap: 8px; align-items: center; }
    .view-btn { padding: 4px 12px; border-radius: var(--dzc-radius-sm, 6px); font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid var(--dzc-border, #334155); background: transparent; color: var(--dzc-text-muted, #94a3b8); }
    .view-btn.active { background: var(--dzc-surface-3, #334155); color: var(--dzc-text, #e2e8f0); }
    .hint { font-size: 11px; color: var(--dzc-text-faint, #64748b); }
    table { width: calc(100% - 48px); margin: 12px 24px; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--dzc-border, #334155); vertical-align: top; }
    th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--dzc-text-faint, #64748b); position: sticky; top: 0; background: var(--dzc-bg, #0f172a); }
    tr:hover td { background: var(--dzc-bg-tint, rgba(15,23,42,.5)); }
    .classname { font-family: ui-monospace, monospace; font-size: 12px; color: var(--dzc-text-muted, #94a3b8); }
    .tier-badge { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--dzc-surface-3, #334155); color: var(--dzc-text-muted, #94a3b8); white-space: nowrap; }
    .tier-badge.unique { background: #7c3aed; color: #fff; }
    .cat-badge { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--dzc-surface-3, #334155); color: var(--dzc-text-muted, #94a3b8); white-space: nowrap; }
    .empty { margin: 24px; padding: 24px; border: 1px dashed var(--dzc-border, #334155); border-radius: var(--dzc-radius-md, 8px); font-size: 13px; color: var(--dzc-text-muted, #94a3b8); }
    .empty h3 { margin: 0 0 8px; font-size: 14px; color: var(--dzc-text, #e2e8f0); }
    .compare-head td { font-weight: 600; font-size: 14px; }
    .fineprint { font-size: 11px; color: var(--dzc-text-faint, #64748b); padding: 4px 24px 24px; }
    .load-error { color: var(--dzc-danger, #ef4444); font-size: 12px; padding: 24px; }
    .clear-btn { padding: 4px 12px; border-radius: var(--dzc-radius-sm, 6px); font-size: 12px; cursor: pointer; border: 1px solid var(--dzc-border, #334155); background: transparent; color: var(--dzc-text-muted, #94a3b8); }
  </style>
  <script src="/js/instance-config.js" defer></script>
  <script src="/js/item-catalog.js" defer></script>
</head>
<body class="min-h-screen">
  <div class="topbar">
    <div class="flex items-center gap-4">
      <a href="/dashboard" style="color: var(--dzc-text-muted, #94a3b8); font-size: 14px;">← Dashboard</a>
      <h1 style="margin: 0; font-size: 18px;">🎒 Item Catalog</h1>
    </div>
    <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
      <input id="search" class="search-input" type="search" aria-label="Search item catalog" placeholder="Classname Finder — search name or classname…" autocomplete="off">
      <select id="map" class="map-select" aria-label="Map">
        <option value="nasdara">nasdara</option>
        <option value="chernarusplus">chernarusplus</option>
      </select>
    </div>
  </div>
  <p class="framing" id="framing">Loading…</p>
  <div class="tabs" id="tabs"></div>
  <div class="view-toggle">
    <button class="view-btn active" id="view-info" type="button">Info</button>
    <button class="view-btn" id="view-compare" type="button">Compare</button>
    <span class="hint">Check up to 4 items in Info, then switch to Compare for a side-by-side table.</span>
    <button class="clear-btn" id="clear-compare" type="button" style="display:none">Clear selection</button>
  </div>
  <div id="catalog-freshness" class="flex justify-end" style="padding: 4px 24px 0;"></div>
  <div id="content"><div class="dzc-empty"><span class="dzc-spinner" role="status" aria-label="Loading"></span><div class="dzc-empty-title">Loading catalog…</div></div></div>
  <p class="fineprint" id="fineprint"></p>

  <script src="/js/data-freshness.js"></script>
  <script src="/js/items-page.js"></script>
</body>
</html>
